version: '3.9'

services:
  client1:
    hostname: client1
    build:
      context: .
    networks:
      net1:
        ipv4_address: 172.20.0.2
      net4:
        ipv4_address: 172.23.0.2
    cap_add:
      - ALL
      - NET_ADMIN
    working_dir: /home/ubuntu/
    privileged: true
    volumes:
      - ./shared/common:/home/ubuntu/common
      - ./shared/client1_data:/home/ubuntu/
      - ./shared/client1_etc:/etc/frr/

  server1:
    hostname: server1
    build:
      context: .
    networks:
      net1:
        ipv4_address: 172.20.0.3
      net2:
        ipv4_address: 172.21.0.3
    cap_add:
        - ALL
        - NET_ADMIN
    working_dir: /home/ubuntu/
    privileged: true
    volumes:
        - ./shared/common:/home/ubuntu/common
        - ./shared/server1_data:/home/ubuntu/
        - ./shared/server1_etc:/etc/frr/

  server2:
    hostname: server2
    build:
      context: .
    networks:
      net2:
        ipv4_address: 172.21.0.4
      net3:
        ipv4_address: 172.22.0.4
    volumes:
      - ./shared/common:/home/ubuntu/common
      - ./shared/server2_data:/home/ubuntu/
      - ./shared/server2_etc:/etc/frr/
    cap_add:
      - NET_ADMIN

  client2:
    hostname: client2
    build:
      context: .
    networks:
      net3:
        ipv4_address: 172.22.0.5
      net4:
        ipv4_address: 172.23.0.5
    cap_add:
      - ALL
      - NET_ADMIN
    volumes:
      - ./shared/common:/home/ubuntu/common
      - ./shared/client2_data:/home/ubuntu/      
      - ./shared/client2_etc:/etc/frr/


networks:
  net1:
    ipam:
      config:
        - subnet: 172.20.0.0/16
  net2:
    ipam:
      config:
        - subnet: 172.21.0.0/16
  net3:
    ipam:
      config:
        - subnet: 172.22.0.0/16
  net4:
    ipam:
      config:
        - subnet: 172.23.0.0/16
